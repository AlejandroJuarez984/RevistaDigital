<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Arquitectura de tres capas de Stream Analytics</title>
  <desc id="d">Fuentes de eventos alimentan la ingesta (Kafka, Event Hubs), luego el procesamiento (Flink, Spark) y finalmente la salida (dashboards, alertas, APIs).</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#17324d"/>
    </marker>
  </defs>
  <rect width="900" height="260" fill="#f5f8fb"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="80" width="150" height="100" rx="10" fill="#dfe9f2" stroke="#17324d" stroke-width="2"/>
    <text x="95" y="122" font-size="17" font-weight="700" fill="#17324d">Fuentes</text>
    <text x="95" y="146" font-size="13" fill="#17324d">IoT, pagos, clics</text>

    <rect x="240" y="80" width="190" height="100" rx="10" fill="#17324d"/>
    <text x="335" y="116" font-size="17" font-weight="700" fill="#fff">1. Ingesta</text>
    <text x="335" y="140" font-size="13" fill="#fff">Brokers de eventos</text>
    <text x="335" y="160" font-size="13" fill="#cfe0ee">Kafka, Event Hubs</text>

    <rect x="500" y="80" width="190" height="100" rx="10" fill="#17324d"/>
    <text x="595" y="116" font-size="17" font-weight="700" fill="#fff">2. Procesamiento</text>
    <text x="595" y="140" font-size="13" fill="#fff">Con estado y ventanas</text>
    <text x="595" y="160" font-size="13" fill="#cfe0ee">Flink, Spark</text>

    <rect x="760" y="80" width="125" height="100" rx="10" fill="#17324d"/>
    <text x="822" y="116" font-size="17" font-weight="700" fill="#fff">3. Salida</text>
    <text x="822" y="140" font-size="13" fill="#fff">Dashboards</text>
    <text x="822" y="160" font-size="13" fill="#cfe0ee">Alertas, APIs</text>
  </g>
  <g stroke="#17324d" stroke-width="2.5" marker-end="url(#a)">
    <line x1="172" y1="130" x2="236" y2="130"/>
    <line x1="432" y1="130" x2="496" y2="130"/>
    <line x1="692" y1="130" x2="756" y2="130"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
